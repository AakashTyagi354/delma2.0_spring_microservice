server:
  port: 8089

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  main:
    web-application-type: reactive
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: userservice
              uri: lb://userservice
              predicates:
                - Path=/api/v1/admin/**,/auth/**,/api/users/**
            - id: doctorservice
              uri: lb://doctorservice
              predicates:
                - Path=/api/v1/doctor/**
            - id: appointmentservice
              uri: lb://appointmentservice
              predicates:
                - Path=/api/v1/slots/**,/api/v1/appointments/**,/api/v1/consultation-notes/**
            - id: categoryservice
              uri: lb://categoryservice
              predicates:
                - Path=/api/v1/category/**
            - id: productservice
              uri: lb://productservice
              predicates:
                - Path=/api/v1/product/**
            - id: notificationservice
              uri: lb://notificationservice
              predicates:
                - Path=/api/v1/notifications/**
            - id: documentservice
              uri: lb://documentservice
              predicates:
                - Path=/api/v1/documents/**
            - id: orderservice
              uri: lb://orderservice
              predicates:
                - Path=/api/v1/orders/**
            - id: paymentservice
              uri: lb://paymentservice
              predicates:
                - Path=/api/v1/payments/**
            - id: aiservice
              uri: lb://aiservice
              predicates:
                - Path=/api/v1/ai/**


# Eureka client config for gateway
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

rate-limiting:
  enabled: true
  routes:
    - path: /api/v1/ai/**
      limit: 10
      window-seconds: 60
      key-by: USER_ID
    - path: /api/v1/payments/**
      limit: 5
      window-seconds: 60
      key-by: USER_ID
    - path: /auth/login
      limit: 5
      window-seconds: 60
      key-by: IP
    - path: /auth/resend-otp
      limit: 3
      window-seconds: 60
      key-by: IP
    - path: /**
      limit: 100
      window-seconds: 60
      key-by: USER_ID

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: gateway
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/gateway.log
  logback:
    rollingpolicy:
      max-history: 7



jwt:
  secret: Z0ZqQm1nQ0tZQ1N2R3p3VjVnQ0hFZ3pMZ1R2aD...

