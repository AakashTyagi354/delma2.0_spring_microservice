name: Delma CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean install -DskipTests

      # ── Download OpenTelemetry agent ─────────────────────────────────────
      # GitHub Actions runner is a fresh machine every run — no agents/ dir
      # Each Dockerfile does: COPY agents/opentelemetry-javaagent.jar
      # So we must download it here before any Docker build step
      # agents/ is in .gitignore — not committed, always downloaded fresh
      - name: Download OpenTelemetry Agent
        run: |
          mkdir -p agents
          curl -L https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.3.0/opentelemetry-javaagent.jar \
            -o agents/opentelemetry-javaagent.jar
          echo "Agent downloaded: $(ls -lh agents/opentelemetry-javaagent.jar)"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── discovery-server — no OTel agent needed ──────────────────────────
      # Eureka server is infrastructure, not a business service
      # No tracing needed here — context stays as ./discovery-server
      - name: Build and push discovery-server
        uses: docker/build-push-action@v5
        with:
          context: ./discovery-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-discovery-server:latest

      # ── All other services — context: . (project root) ──────────────────
      # WHY context: . instead of context: ./servicename?
      #
      # Each Dockerfile has: COPY agents/opentelemetry-javaagent.jar
      # agents/ lives at project root, not inside each service directory
      #
      # context: ./gateway   → Docker only sees gateway/ → agents/ invisible → COPY fails
      # context: .           → Docker sees entire project → agents/ visible → COPY works
      #
      # file: ./gateway/Dockerfile tells Docker which Dockerfile to use
      # when context is the project root

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-gateway:latest

      - name: Build and push userservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./userservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-userservice:latest

      - name: Build and push doctorservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./doctorservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-doctorservice:latest

      - name: Build and push appointmentservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./appointmentservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-appointmentservice:latest

      - name: Build and push paymentservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./paymentservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-paymentservice:latest

      - name: Build and push documentservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./documentservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-documentservice:latest

      - name: Build and push notificationservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notificationservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-notificationservice:latest

      - name: Build and push productservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./productservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-productservice:latest

      - name: Build and push categoryservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./categoryservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-categoryservice:latest

      - name: Build and push orderservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./orderservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-orderservice:latest

      - name: Build and push aiservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./aiservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delma-aiservice:latest