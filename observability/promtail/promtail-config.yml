server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: delma-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: delma
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            correlationId: correlationId
            message: message
            logger_name: logger_name
      - labels:
          level:
          service:
          correlationId:
      - output:
          source: message
